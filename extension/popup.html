<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      margin: 0;
    }
    .badge {
      background-color: #1f6feb;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .section {
      margin-bottom: 16px;
    }
    .label {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value {
      font-size: 14px;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      background-color: #238636;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .status-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      margin-top: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .green-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #39d353;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">PRIVYBROWSE AI</h1>
    <span class="badge" id="trust-badge">Secure Zone</span>
  </div>

  <div class="section">
    <button class="btn" id="capture-btn">Connect & Observe Page</button>
  </div>

  <div class="status-box">
    <div class="status-row">
      <span>Perception Engine:</span>
      <span style="color: #58a6ff; font-weight: bold;">LOCAL (ON-DEVICE)</span>
    </div>
    <div class="status-row">
      <span>PII Redactor:</span>
      <span style="color: #39d353; font-weight: bold;">ACTIVE</span>
    </div>
    <div class="status-row">
      <span>Connection:</span>
      <span><span class="green-dot"></span>Connected</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
