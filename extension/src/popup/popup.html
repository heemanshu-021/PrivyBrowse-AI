<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivyBrowse AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <div class="brand-badge">🛡️</div>
        <div>
          <div class="brand-name">PRIVYBROWSE AI</div>
          <div class="brand-tagline">See. Understand. Protect. Act.</div>
        </div>
      </div>
    </div>

    <!-- Status Section -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Local Engine:</span>
        <span id="engine-status" class="status-pill status-standby">Checking...</span>
      </div>
      <div class="status-row">
        <span class="status-label">Current Host:</span>
        <span id="page-host" class="status-host">Detecting...</span>
      </div>
    </div>

    <!-- Feedback Message Box -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Action Buttons -->
    <div class="action-section">
      <button id="btn-analyze" class="btn btn-cyan">
        <span class="btn-icon">⚡</span>
        <span id="btn-analyze-text">Analyze Page</span>
      </button>

      <div class="agent-controls-row">
        <button id="btn-start" class="btn btn-primary btn-sm">▶ Start Agent</button>
        <button id="btn-pause" class="btn btn-secondary btn-sm">⏸ Pause</button>
        <button id="btn-stop" class="btn btn-secondary btn-sm">⏹ Stop</button>
      </div>

      <button id="btn-dashboard" class="btn btn-secondary btn-full">
        <span>📊 Open PrivyBrowse Dashboard</span>
      </button>
    </div>

    <!-- Footer Trust Badge -->
    <div class="popup-footer">
      <div class="trust-indicator">
        <span class="trust-dot"></span>
        <span>Local On-Device Protection Ready</span>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
