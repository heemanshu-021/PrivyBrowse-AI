<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivyBrowse Synthetic Evaluation Portal</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background-color: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      color: #00f2fe;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 11px;
      color: #94a3b8;
    }
    .field-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0a0e17;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: #00f2fe;
    }
    .search-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      margin-bottom: 14px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      width: 100%;
      background: #0284c7;
      color: white;
      margin-top: 6px;
    }
    .btn-cyan {
      background: #00f2fe;
      color: #090d16;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
    }
    .nav-links a {
      color: #38bdf8;
      text-decoration: none;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PRIVYBROWSE DEMO</h1>
      <p>Synthetic Test Page for DOM Extraction & Visual Perception</p>
    </div>

    <form id="demo-form" onsubmit="event.preventDefault(); alert('Demo Form Submitted!');">
      <div class="field-group">
        <label for="user-name">Full Name</label>
        <input type="text" id="user-name" name="name" value="John Smith" placeholder="John Smith">
      </div>

      <div class="field-group">
        <label for="user-email">Email Address <span class="badge">PII</span></label>
        <input type="email" id="user-email" name="email" value="john@example.com" placeholder="john@example.com">
      </div>

      <div class="field-group">
        <label for="user-phone">Phone Number <span class="badge">PII</span></label>
        <input type="tel" id="user-phone" name="phone" value="9876543210" placeholder="9876543210">
      </div>

      <div class="field-group">
        <label for="user-password">Password <span class="badge">SENSITIVE</span></label>
        <input type="password" id="user-password" name="password" value="SecretPass123!" placeholder="••••••••">
      </div>

      <div class="search-row">
        <input type="text" id="search-query" placeholder="Search documentation..." style="flex: 1;">
        <button type="button" id="btn-search" class="btn btn-cyan">SEARCH</button>
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary">LOGIN</button>
    </form>

    <div class="nav-links">
      <a href="#home" id="link-home">Home</a>
      <a href="#products" id="link-products">Products</a>
      <a href="#about" id="link-about">About</a>
    </div>
  </div>
</body>
</html>
