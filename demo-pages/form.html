<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic Checkout Payment Page</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background-color: #0b0f19;
      color: #cbd5e1;
      margin: 0;
      padding: 40px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-row {
      margin-bottom: 18px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    .disclaimer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Secure Order Checkout</h2>
    <form onsubmit="event.preventDefault(); alert('Order placed! Simulated payment processed securely.');">
      <div class="form-row">
        <label for="checkout-name">Cardholder Name</label>
        <input type="text" id="checkout-name" name="owner" placeholder="Amit Sharma" required>
      </div>
      <div class="form-row">
        <label for="checkout-email">Billing Email</label>
        <input type="email" id="checkout-email" name="email" placeholder="amit.sharma@example.com" required>
      </div>
      <div class="form-row">
        <label for="card-number">Credit Card Number</label>
        <input type="text" id="card-number" name="card" placeholder="4111 2222 3333 4444" required>
      </div>
      <div class="grid-2">
        <div class="form-row">
          <label for="card-expiry">Expiry Date</label>
          <input type="text" id="card-expiry" placeholder="12/28" required>
        </div>
        <div class="form-row">
          <label for="card-cvv">CVV/CVC</label>
          <input type="password" id="card-cvv" placeholder="•••" required>
        </div>
      </div>
      <div class="form-row">
        <label for="checkout-address">Delivery Address</label>
        <input type="text" id="checkout-address" name="address" placeholder="12, MG Road, Bangalore, KA" required>
      </div>
      <button type="submit" class="btn">Confirm & Pay Order</button>
      <div class="disclaimer">
        This is a synthetic environment. None of your real data will be captured or transmitted.
      </div>
    </form>
  </div>
</body>
</html>
