<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic User Profile Setup</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      margin: 0;
      padding: 40px;
    }
    .profile-card {
      max-width: 500px;
      margin: 0 auto;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      margin-bottom: 24px;
    }
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #38bdf8;
      background-color: #0f172a;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }
    .btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <h2>Secure User Profile</h2>
    <div class="avatar-wrapper">
      <img src="face.jpg" alt="Profile Picture" class="avatar-img" id="profile-avatar">
    </div>
    <form onsubmit="event.preventDefault(); alert('Profile updated securely.');">
      <div class="form-group">
        <label for="profile-name">Full Name</label>
        <input type="text" id="profile-name" name="name" placeholder="Johnathan Doe" value="Johnathan Doe" required>
      </div>
      <div class="form-group">
        <label for="profile-id">Employee ID Number (Sensitive)</label>
        <input type="text" id="profile-id" name="id" placeholder="SSN-like ID" value="987-65-4321" required>
      </div>
      <button type="submit" class="btn">Save Profile Settings</button>
    </form>
  </div>
</body>
</html>
