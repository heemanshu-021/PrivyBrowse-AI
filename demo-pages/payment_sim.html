<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivyBrowse — Procurement Payment Simulation</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    input {
      background-color: #0d131f;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }
    .btn-submit {
      width: 100%;
      background-color: var(--accent-red);
      color: white;
      font-weight: 700;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    .security-notice {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent-red);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin-top: 0; font-size: 18px;">💳 Procurement Payment Simulation</h2>
    
    <div class="security-notice">
      🔒 <strong>High-Risk Action Gate:</strong> Autonomous payment submission requires mandatory human confirmation.
    </div>

    <form id="payment-form" onsubmit="event.preventDefault(); alert('Payment Authorized');">
      <div class="field">
        <label>Billing Organization</label>
        <input type="text" id="billing-org" value="ISRO Satellite Center" />
      </div>

      <div class="field">
        <label>Cardholder Name</label>
        <input type="text" id="billing-name" value="Amit Sharma" />
      </div>

      <div class="field">
        <label>Payment Card Number (Luhn Valid)</label>
        <input type="text" id="card-num" value="4111 2222 3333 4444" />
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="field">
          <label>Expiry</label>
          <input type="text" id="card-exp" value="12/28" />
        </div>
        <div class="field">
          <label>Security Code (CVV)</label>
          <input type="password" id="card-cvv" value="899" />
        </div>
      </div>

      <div class="field">
        <label>Total Transaction Amount</label>
        <input type="text" id="tx-amount" value="₹1,450,000" readonly style="color: var(--accent-cyan); font-weight: 700;" />
      </div>

      <button type="submit" class="btn-submit" id="btn-submit-payment">
        Authorize & Submit Payment
      </button>
    </form>
  </div>
</body>
</html>
