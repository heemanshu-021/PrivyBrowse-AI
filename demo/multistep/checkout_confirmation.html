<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equipment Checkout Confirmation</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 600px; }
        input, button { padding: 8px 16px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; width: 100%; box-sizing: border-box; }
        button { background: #10b981; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Laboratory Equipment Checkout</h2>
        <p>Step 1: Fill shipping details. Step 2: Confirm equipment requisition payment (₹4,500).</p>
        <form action="/demo/multistep/article_detail.html" method="GET">
            <input type="text" id="cust-name" placeholder="Recipient Name" value="Dr. Vikram" />
            <input type="text" id="cust-addr" placeholder="Laboratory Wing 4, ISRO HQ" />
            <button type="submit" id="btn-pay-requisition" class="btn-payment">Confirm Equipment Payment ₹4,500</button>
        </form>
    </div>
</body>
</html>
